name: Forecast on new tournament questions

# Questions in the Fall 2026 FutureEval tournament open in batches and each one
# is open for exactly 3 hours (verified from 151/152 historical windows), so the
# requirement is one successful run inside each 3-hour window. Hourly gives three
# attempts per window -- enough headroom for a transient API failure, without
# burning a run every 20 minutes.
on:
  workflow_dispatch:
  schedule:
    - cron: "13 * * * *"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  forecast_job:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        run: python main.py
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
